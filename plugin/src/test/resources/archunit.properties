# Do not chase unresolved types onto the classpath. The rules in ShippedCodeArchitectureTest are
# about what the shipped bytecode *references*, and a reference is a name in the constant pool —
# ArchUnit models an unresolved target as a stub carrying that name, which is all those rules need.
# Leaving resolution on would drag the whole IntelliJ Platform through the classloader to learn
# nothing.
resolveMissingDependenciesFromClassPath=false
