group = com.snippetveil
version = 1.3.0

# The IntelliJ Platform bundles the Kotlin standard library, so nothing here ships one.
# -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true

# **How much heap the build gets, stated rather than defaulted.**
#
# Every other input to this build is pinned — the platform versions, the Gradle distribution, the
# action SHAs — and until now the memory the Kotlin compiler runs in was the one thing left to
# whatever the JVM happened to default to. That held for as long as the default happened to be
# enough, which is not a property anybody chose and not one anything checked.
#
# What found it was CodeQL. GitHub's default setup autobuilds with `--no-daemon` and its own tracer
# preloaded into the compiler, so the same `testClasses` this repo runs in seconds carries an
# extractor and cannot hand the work to a warm daemon. On a build with no headroom that does not
# fail fast: it GC-thrashes for twenty-five minutes and then dies with `OOMErrorException`, which
# reads as a hung job rather than as an out-of-memory one. `./gradlew check` stayed green throughout,
# which is exactly what a missing setting looks like — nothing is wrong until something asks for
# slightly more than the default.
#
# So the number is here, in gradle.properties, and not in a workflow: the rule is thin CI over thick
# Gradle, and a memory setting that lived in YAML would be one the person reading the build cannot
# reproduce. Runners have ~16 GB and a developer machine has more, so this is headroom rather than a
# budget — it is set to stop being marginal, not to be exact.
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g

# The Kotlin compile is the half that actually ran out, and it is a separate process with a separate
# heap: `org.gradle.jvmargs` alone does not reach it, which is why the compiler's own error message
# names this property and not that one.
kotlin.daemon.jvmargs = -Xmx3g

# Which IntelliJ Platform this build compiles and tests against.
#
# `floor` is the compatibility floor the plugin descriptor names in sinceBuild, and it is the
# default: a plain `./gradlew build` builds and tests exactly what ships. `latest` is the newest
# stable IDE, and CI's test job runs there too — untilBuild is unset, so the descriptor claims 242
# *and everything after it*, while verifyPlugin only checks API compatibility, not behaviour. PSI
# resolution behaviour across four years of platform releases is what drifts quietly, and running
# the tests against a recent IDE is the only thing that catches it. If the matrix ever proves
# painful, the honest fix is to raise the floor, not to stop testing it.
#
# `k2` is the third cell, and the block above `platformK2Type` says why a Kotlin fixture needs one
# of its own rather than running on the floor.
#
# The profiles do not all name the same product, and that is not a mistake: IntelliJ IDEA Community
# (IC) stopped being published after 2025.2, and the free IDE after that is the unified IntelliJ
# IDEA (IU). Testing the floor on IC is testing what a floor user actually runs.
#
# **The floor moved from 2024.1.7 to 2024.2.6 with Kotlin support**, because the Kotlin Analysis API
# does not exist on the 241 branch: it bundles the pre-rename `high-level-api*` libraries and has no
# `supportsKotlinPluginMode` extension point at all. The spec fixes that the raise happens in the same
# release as Kotlin and never ahead of it, and that the 241 line then *freezes* rather than being
# maintained — v1.2.0 is that frozen line, and it is already published. A 2024.1 user keeps being
# served v1.2.0 by the Marketplace and nothing is withdrawn from them.
#
# `latest` is a pin rather than a lookup, so that a run is reproducible and a bump is a reviewable
# one-line diff. It does go stale, and bumping it is a maintenance chore nothing automates.
#
# **Three cells, one added leg — not a cross-product.** The Kotlin fixtures run in `k2` and `latest`
# and nowhere else; contributor pinning varies per test class inside one JVM, so the platform
# profiles are the only real multiplication.
#
# Bisecting a behaviour drift by hand needs no extra machinery — a -P overrides any of these:
#     ./gradlew test -PplatformFloorVersion=2024.3.5
platformProfile = floor

platformFloorType = IC
platformFloorVersion = 2024.2.6

# **The cell where a Kotlin fixture can honestly run, and the reason the floor cannot be it.**
#
# The descriptor declares `supportsK1="false" supportsK2="true"`, so K1/FE10 is a configuration this
# plugin says it does not support and where the platform skips its optional descriptor outright. The
# Kotlin plugin's default mode on the 242 floor is K1 — so a Kotlin fixture running there would be
# measuring an unsupported configuration, and would do it *silently*, because which Analysis API
# components FE10 leaves unimplemented is not enumerated anywhere this project can read.
#
# 2025.1 is the first release where K2 is the Kotlin plugin's default mode, which makes it the
# earliest platform any Kotlin assertion here can run on. The floor cell therefore stays Java-only,
# before and after any raise: it exists to test the one thing the floor actually promises, which is
# PSI resolution behaviour on the oldest supported IDE. `KotlinHarnessTest` asserts the mode it got
# rather than trusting this pin, so a build where the default moved fails loudly here.
#
# **Explicitly rejected: forcing K2 on the floor cell to obtain a Kotlin cell there.** It tests a
# configuration the plugin declares unsupported by default, and it becomes a cell to defend forever.
#
# IC rather than IU for the same reason the floor is IC — IntelliJ IDEA Community was still being
# published on the 251 branch, and it stopped only after 2025.2.
platformK2Type = IC
platformK2Version = 2025.1.7.2

platformLatestType = IU
platformLatestVersion = 2026.2.1
