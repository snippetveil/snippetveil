# Pinning actions to a commit SHA is what makes this file necessary: a SHA cannot be repointed by
# whoever controls the action's repository, and it also cannot pick up a fix on its own. Dependabot
# is the other half of that trade — it keeps the SHAs current, and the cost is a pull request to
# review, which runs the same merge gate as any other.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for the lot. These land together or not at all, and reviewing five one-line
    # SHA bumps separately is how a SHA bump stops being read.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    # **The one dependency here that must not be kept current.** `kotlinFixtureStdlib` pins
    # `kotlin-stdlib` deliberately *old* — older than every compiler in the matrix — because stdlib
    # metadata is forwards-incompatible, so a newer one resolves to nothing in the analysing session.
    # That is the fail-green the attachment exists to prevent: unresolved fails closed into `Unknown`,
    # everything gets renamed, and the leak oracle comes back maximally green over a broken harness.
    #
    # Dependabot offered exactly that bump, bundled with a legitimate `kotlin.jvm` one, and the
    # harness's own precondition caught it — `test a kotlin standard library member resolves to
    # library origin`. Ignored here so the offer stops arriving weekly, rather than relying on
    # somebody reading the comment on the pin every time. The artifact is declared in exactly one
    # place, so nothing else loses its updates. This only stops the offer: a hand edit is still
    # possible, and `assertTheFixtureStdlibIsOlderThanTheCompiler` fails that one by name.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
