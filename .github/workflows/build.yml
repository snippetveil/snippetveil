# Thin CI over thick Gradle: every check this file runs is a Gradle task, and this file runs Gradle
# without knowing what is in it. That is the same rule the trust checks follow — a check that exists
# only in YAML cannot be run by the person reading SnippetVeil's no-network claim. See
# CONTRIBUTING.md.

name: Build

on:
  push:
    branches: [main]
  pull_request:

# A repository whose pitch is "audit me" has no implicit write-all anywhere. This is the whole
# token for every job below; the one job that needs more asks for it itself.
permissions:
  contents: read

# A pull request only needs its newest commit checked. `main` is never cancelled: its runs are what
# the draft release is cut from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # `jvmToolchain(17)`. Anything else the build asks for, the foojay resolver configured in
          # settings.gradle.kts downloads.
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Stated rather than inherited. This is the check that the wrapper jar committed to the
          # repository is one Gradle published, and a jar in a repository is exactly the thing this
          # project does not ask anyone to take on faith.
          validate-wrappers: true
          # The open-source cache backed by GitHub Actions, not the commercial caching service.
          # Nothing about this build goes to a third party that does not have to.
          cache-provider: basic

      - name: buildPlugin
        run: ./gradlew buildPlugin

      # Asked of Gradle rather than grepped out of gradle.properties: the version is the build's to
      # define, and this file does not get to know how.
      - name: Read the plugin version
        id: properties
        run: |
          version="$(./gradlew -q :properties --property version --console=plain | grep '^version:' | cut -d' ' -f2-)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnippetVeil-${{ steps.properties.outputs.version }}
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

  test:
    name: check (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      # Which of the two platforms broke is the interesting half of the result, so neither leg
      # cancels the other.
      fail-fast: false
      matrix:
        # The sinceBuild = 241 floor and latest stable. `untilBuild` is unset, so the descriptor
        # claims 241 *and everything after it*, and verifyPlugin checks API compatibility rather
        # than behaviour — PSI resolution behaviour across four years of platform releases is what
        # drifts quietly. Which version each name means is gradle.properties' business.
        #
        # Tiers 1-3 all run inside `check`, and all of them are merge gates on every pull request,
        # not a nightly: a nightly failure on a solo project is a failure nobody is watching.
        platform: [floor, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: check
        run: ./gradlew check -PplatformProfile=${{ matrix.platform }}

      # A red build is worth nothing without the report that says why.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.platform }}
          path: |
            core/build/reports/
            plugin/build/reports/
          if-no-files-found: ignore

  verify:
    name: verifyPlugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      # `ides { recommended() }` is several IDE downloads, and which IDEs it recommends changes
      # whenever JetBrains ships one. Restore-then-save rather than one cache step, because a
      # fixed key would hit forever and never take a newly recommended IDE with it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ runner.os }}-
          restore-keys: plugin-verifier-ides-${{ runner.os }}-

      - name: verifyPlugin
        run: ./gradlew verifyPlugin

      # Written only from `main`. A pull request restores `main`'s entry and adds nothing, and an
      # entry per pull request would churn the repository's cache budget out from under the IDEs
      # this is here to keep.
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ runner.os }}-${{ github.run_id }}

      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-report
          path: plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore

  release-draft:
    name: Draft a release
    # The manual-acceptance gate. A draft is cut from every green `main`; a human publishing it is
    # what fires release.yml.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build, test, verify]
    runs-on: ubuntu-latest
    permissions:
      # The only write in this file, and it is scoped to the one job that needs it: creating a
      # release writes to the repository. Nothing else here asks for more than `contents: read`.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job reads the release notes out of the changelog, and that is a Gradle task like every
      # other check here — thin CI over thick Gradle applies to the release text too.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      # Yesterday's draft is not a release anybody wants to publish by accident, and the tag is
      # never pushed until a draft is published, so replacing it costs nothing.
      #
      # Scoped to `v*` — the tags this job itself creates. A draft under any other tag is somebody
      # working by hand, and a push to `main` does not get to delete that.
      - name: Replace the previous draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # `version` is a constant in gradle.properties, so once v$VERSION is published the tag
          # exists and `gh release create` would fail on every later push. Bumping the version is a
          # human release step; being red until someone does is not a useful way to say so.
          published="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$published" = "false" ]; then
            echo "::warning::v$VERSION is already published. Bump version in gradle.properties for main to draft again."
            exit 0
          fi

          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName | select(startswith("v"))' \
            | while read -r tag; do gh release delete "$tag" --yes; done

          # The notes are the `## Unreleased` section of CHANGELOG.md, not a generated list of
          # commit subjects. They are the text a Marketplace reviewer reads — placeholder change
          # notes are a documented rejection reason — so they are written by a person, and the
          # draft shows exactly what would be uploaded rather than something that resembles it.
          ./gradlew -q getChangelog --unreleased --no-header --no-summary > notes.md

          gh release create "v$VERSION" --draft --title "v$VERSION" \
            --target "$GITHUB_SHA" --notes-file notes.md
