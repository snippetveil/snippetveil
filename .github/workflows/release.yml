# Publishing to JetBrains Marketplace, gated on the same checks a pull request runs.
#
# The template this is adapted from runs a bare `publishPlugin` here, on the reasoning that the tag
# was cut from a green `main`. A tag can be pushed at anything, and "we published a build that never
# passed CI" is a sentence a plugin whose pitch is "audit me" cannot survive. The cost is a few
# minutes on a handful of releases a year.

name: Release

on:
  release:
    types: [prereleased, released]

# Nothing here writes to the repository. The upload is authenticated by PUBLISH_TOKEN against
# JetBrains Marketplace, not by the GitHub token, so the GitHub token stays read-only.
permissions:
  contents: read

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      # The tag the release names, not whatever `main` is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ runner.os }}

      # Three steps rather than one `./gradlew check verifyPlugin publishPlugin`, for one reason:
      # Gradle orders a task graph by dependency, not by the order the tasks were named on the
      # command line, and `publishPlugin` depends on neither of the two before it. A step boundary
      # is a barrier no scheduler gets to reorder.
      - name: check
        run: ./gradlew check

      - name: verifyPlugin
        run: ./gradlew verifyPlugin

      - name: publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          # Read straight out of the environment by the IntelliJ Platform Gradle plugin's signing
          # extension; `signPlugin` is skipped when the key is absent, which is what makes a fork
          # without these secrets able to run everything above this step.
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
