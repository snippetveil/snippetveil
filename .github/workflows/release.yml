# Publishing to JetBrains Marketplace, gated on the same checks a pull request runs.
#
# The template this is adapted from runs a bare `publishPlugin` here, on the reasoning that the tag
# was cut from a green `main`. A tag can be pushed at anything, and "we published a build that never
# passed CI" is a sentence a plugin whose pitch is "audit me" cannot survive. The cost is a few
# minutes on a handful of releases a year.

name: Release

on:
  release:
    types: [prereleased, released]

# Nothing here writes to the repository. The upload is authenticated by PUBLISH_TOKEN against
# JetBrains Marketplace, not by the GitHub token, so the GitHub token stays read-only.
permissions:
  contents: read

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    # **Where the four secrets live, and the only job in either workflow that can reach them.**
    #
    # They are the plugin's identity: whoever holds them can sign and publish as SnippetVeil. Fork
    # pull requests never receive secrets, so the naive vector was closed already — the live one is
    # a compromised third-party action in `build.yml`, which would run with every *repository*
    # secret and none of the *environment* ones. Scoping them here takes the signing key out of the
    # blast radius of the pipeline that runs unmerged code.
    #
    # The environment also carries a required reviewer, so an upload waits on a second deliberate
    # human act after the release was published — which is the posture the Marketplace's own manual
    # review already imposes on the other end.
    #
    # `:assertOnlyTheGatedJobCanReachTheSigningKey` in the root build fails `check` if this line
    # goes missing, or if any other workflow starts naming one of the four.
    environment: marketplace

    steps:
      # The tag the release names, not whatever `main` is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ runner.os }}-
          restore-keys: plugin-verifier-ides-${{ runner.os }}-

      # Separate steps rather than one `./gradlew check verifyPlugin publishPlugin`, for one
      # reason: Gradle orders a task graph by dependency, not by the order the tasks were named on
      # the command line, and `publishPlugin` depends on none of the ones before it. A step
      # boundary is a barrier no scheduler gets to reorder.
      #
      # Every platform leg, not just the floor. The whole point of re-checking here is that the tag
      # need not be anything `main` ever ran, and a partial gate would only partly deliver that.
      - name: check (floor)
        run: ./gradlew check

      - name: check (k2)
        run: ./gradlew check -PplatformProfile=k2

      - name: check (latest)
        run: ./gradlew check -PplatformProfile=latest

      - name: verifyPlugin
        run: ./gradlew verifyPlugin

      - name: publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          # Read straight out of the environment by the IntelliJ Platform Gradle plugin's signing
          # extension; `signPlugin` is skipped when the key is absent, which is what makes a fork
          # without these secrets able to run everything above this step.
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # The bytes the Marketplace just received, handed to a job that can attach them to the
      # release. This is the only channel out of this job that needs no write to the repository:
      # `upload-artifact` authenticates against the run's own artifact store rather than against
      # the GitHub token, so the `contents: read` at the top of this file stays true and the
      # signing key keeps its environment to itself.
      #
      # `-signed.zip` rather than every archive in the directory. `buildPlugin`'s unsigned zip is
      # sitting beside it, and the sentence this asset exists to make true says *every release is
      # signed* — attaching the other one would replace a false claim with a subtler one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-distribution
          path: plugin/build/distributions/*-signed.zip
          if-no-files-found: error

  # **The install-from-disk route, which three published surfaces promise and no release has ever
  # carried.** The README, CONTRIBUTING and the site all tell a reader the distribution zip is on
  # the matching GitHub Release. A plugin whose pitch is *audit me* offers exactly two ways to get
  # the bytes — the Marketplace, and the zip somebody can read before installing it — and the second
  # is the one that does not ask the reader to trust anyone.
  #
  # A separate job, not a step, for the reason `changelog` below is one: it writes to the
  # repository, and a job that writes to the repository does not belong in the environment that
  # holds the signing key. The zip crosses between them through the run's artifact store, so the
  # job that can sign never gets a write and the job that writes never gets the key.
  #
  # `:assertTheReleaseCarriesTheSignedZip` in the root build fails `check` if this comes apart —
  # including the quiet way, where both halves are still here and no longer joined to each other.
  attach:
    name: Attach the signed zip to the release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Attaching an asset is a write to the release, which is a write to the repository. It is the
      # entire reason this is not a step in the job above.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-distribution
          path: signed

      # No checkout: this job attaches bytes it did not build and has no use for the source. `gh`
      # takes the repository from `GH_REPO` rather than from a clone.
      - name: Attach it, then read the release back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          zips=(signed/*-signed.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one signed archive in the artifact, found ${#zips[@]}."
            exit 1
          fi
          zip="${zips[0]}"

          # `--clobber` because this workflow is re-runnable and has to converge rather than fail on
          # an asset it put there itself. The environment's required reviewer means a run can be
          # approved long after the release was published, and the archive is built from the tag
          # either way.
          gh release upload "$TAG" "$zip" --clobber

          # The claim is about what a reader finds on the Releases page, so it is read back off the
          # release rather than inferred from an exit status. Three releases were cut believing an
          # upload had happened somewhere, and the thing that was never true is exactly this line.
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -Fxq "$(basename "$zip")"; then
            echo "::error::$TAG carries no $(basename "$zip") after the upload."
            exit 1
          fi

  # The changelog moves forward only once the upload happened, and it moves through review like any
  # other change to the repository.
  #
  # A separate job, not a step, for two reasons. It must not sit inside the gated one — a job that
  # writes to the repository does not belong in the environment that holds the signing key. And it
  # writes at all, which the job above deliberately does not: `release.yml`'s upload is
  # authenticated against the Marketplace, and the GitHub token it runs with stays read-only.
  #
  # It opens a pull request rather than pushing to `main`, because `main` is protected and because a
  # commit nobody looked at is exactly the kind that turns a changelog into a generated file.
  changelog:
    name: Patch the changelog back
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `main`, not the tag: the tag is where the release was cut from and `main` is where the
      # changelog has to end up.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      # Turns `## Unreleased` into `## <version>` with today's date, and opens a fresh `## Unreleased`
      # above it. What the section says was written by a person before the release; this only moves
      # it under the number it shipped as.
      - name: patchChangelog
        run: ./gradlew patchChangelog

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md is already patched for $VERSION."
            exit 0
          fi

          branch="changelog/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # The DCO applies to every commit in this repository, this one included.
          git commit --signoff -am "Close the changelog on $VERSION"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Close the changelog on $VERSION" \
            --body "\`patchChangelog\` after the $VERSION upload. The notes were written before the release; this moves them under the number they shipped as and opens a fresh \`## Unreleased\`."
