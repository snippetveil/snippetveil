# The chooser page at /issues/new/choose is where every in-IDE `Report a
# problem` link lands, and it is a copy surface: the descriptions below are
# rendered before there is a text box on screen, which makes them the only
# place the *use a synthetic example* instruction can be read rather than
# remembered.
#
# Blank issues are off for that reason and no other. A blank form says nothing
# about what to paste into it, and the balloons that send people here appear at
# the moment something failed on the code they were in the middle of
# anonymizing — which is the worst moment to leave the question open.
blank_issues_enabled: false

# A contact link's `url` has to be http(s). A `mailto:` is dropped from the
# rendered chooser silently — no build error, no banner on this file, just a
# row that is not there — which is why this one points at the security policy
# and the policy carries the address.
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/snippetveil/snippetveil/security/policy
    about: >-
      By email, not on this tracker. A vulnerability report is the one thing
      that must not open in public before there is a fix.
